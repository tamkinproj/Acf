<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="assets/nozoom.js"></script>
<title>Welcome | Al Insania Charity Foundation</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Insania">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/legacy.css">
<script src="assets/boot.js"></script>
<script src="assets/pwa.js" defer></script>
</head>
<body data-page="welcome">
<section class="login">
  <div class="login-box">
    <div class="login-brand"><div class="logo" role="img" aria-label="Al Insania Charity Foundation"></div><span data-t="brand">Al Insania Charity Foundation</span></div>
    <h1 data-t="wel_title">Welcome</h1>
    <p class="lead" data-t="wel_lead">Choose your own password to start. Type the temporary password you were given as the current password.</p>
    <form id="welForm" novalidate>
      <div><label for="wCur" data-t="pw_cur">Current password</label><input id="wCur" type="password" autocomplete="current-password" dir="ltr"></div>
      <div><label for="wNew" data-t="pw_new">New password</label><input id="wNew" type="password" autocomplete="new-password" dir="ltr"></div>
      <div><label for="wAgain" data-t="pw_again">New password again</label><input id="wAgain" type="password" autocomplete="new-password" dir="ltr"></div>
      <p class="note" data-t="pw_hint">At least 12 characters with upper and lower case and a number.</p>
      <div class="err" id="welErr" role="alert"></div>
      <div class="login-foot">
        <button class="login-lang" type="button" data-act="lang"><span data-t="lang_btn">العربية</span></button>
        <button class="btn btn-main" type="submit" data-t="wel_btn">Save and continue</button>
      </div>
    </form>
  </div>
</section>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/welcome.js"></script>
</body>
</html>
