<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="assets/nozoom.js"></script>
<title>Sign in | Al Insania Charity Foundation</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Insania">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/boot.js"></script>
<script src="assets/pwa.js" defer></script>
</head>
<body data-page="login">
<section class="login">
  <div class="card">
    <div class="logo" role="img" aria-label="Al Insania Charity Foundation"></div>
    <h1 style="font-size:1.6rem" data-t="brand">Al Insania Charity Foundation</h1>
    <p class="lead" data-t="staff">Staff portal</p>
    <form id="loginForm" novalidate>
      <div><label for="lEmail" data-t="email">Email</label><input id="lEmail" type="email" placeholder="name@foundation.org" autocomplete="username" dir="ltr"></div>
      <div><label for="lPass" data-t="password">Password</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr"></div>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn btn-main" type="submit" data-t="signin">Sign in</button>
      <p class="note" style="text-align:center;margin:0" data-t="login_hint">Sign in with your account. After the first sign-in the app also works without internet.</p>
      <a class="link-back" href="../index.html" data-t="back_site">Back to website</a>
      <button class="btn btn-line btn-sm" type="button" data-act="lang" style="justify-self:center"><svg class="icon"><use href="#i-globe"/></svg><span data-t="lang_btn">العربية</span></button>
    </form>
  </div>
</section>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/login.js"></script>
</body>
</html>
