<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="assets/nozoom.js"></script>
<title>Sign in | Al Insania Charity Foundation</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Insania">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/legacy.css">
<script src="assets/boot.js"></script>
<script src="assets/pwa.js" defer></script>
</head>
<body data-page="login">
<section class="login">
  <div class="login-box">
    <a class="login-back" href="/"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg><span data-t="back_site">Back to website</span></a>
    <div class="login-brand"><div class="logo" role="img" aria-label="Al Insania Charity Foundation"></div><span data-t="brand">Al Insania Charity Foundation</span></div>
    <h1 data-t="signin">Sign in</h1>
    <form id="loginForm" novalidate>
      <div><label for="lEmail" data-t="login_id">Email or username</label><input id="lEmail" type="text" placeholder="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr"></div>
      <div><label for="lPass" data-t="password">Password</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr"></div>
      <label class="trust-row" for="lTrust"><input id="lTrust" type="checkbox"><span data-t="trust_login">Trust this device</span></label>
      <p class="note trust-note" data-t="trust_hint">On a phone or computer only you use: no request limits, so it does not run into "too many requests". Turn it off in Settings any time.</p>
      <div class="err" id="loginErr" role="alert"></div>
      <p class="note" data-t="login_hint">Sign in with your account. After the first sign-in the app also works without internet.</p>
      <div class="login-foot">
        <button class="login-lang" type="button" data-act="lang"><span data-t="lang_btn">العربية</span></button>
        <button class="btn btn-main" type="submit" data-t="signin">Sign in</button>
      </div>
    </form>
  </div>
</section>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/pages/login.js"></script>
</body>
</html>
