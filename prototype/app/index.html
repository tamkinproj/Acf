<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff portal | Al Insania Charity Foundation</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="index">
<section class="login">
  <div class="card">
    <div class="logo" role="img" aria-label="Al Insania Charity Foundation"></div>
    <h1 style="font-size:1.6rem">Al Insania Charity Foundation</h1>
    <p class="lead">Staff portal</p>
    <div class="actions" style="justify-content:center">
      <a class="btn btn-main" href="login.html">Sign in</a>
      <a class="btn btn-line" href="dashboard.html">Dashboard</a>
    </div>
  </div>
</section>
<script>
/* Entry point: signed-in staff go to the dashboard, everyone else to the sign-in page. */
(function () {
  var ok = false;
  try { ok = sessionStorage.getItem("acf_auth") === "1"; } catch (e) {}
  location.replace(ok ? "dashboard.html" : "login.html");
})();
</script>
</body>
</html>
