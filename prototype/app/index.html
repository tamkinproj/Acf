  --bg:#ffffff; --ink:#17300d; --brand:#3f7010; --brand-hover:#305a0c; --text:#3d4a36; --muted:#6b7565;
  --line:rgba(23,48,13,.08); --accent:#9acd32; --accent-ink:#3f7010; --accent-soft:#f1f8d8;
  --glass:rgba(255,255,255,.72); --fill:rgba(110,125,100,.12);
  --r-lg:1.75rem; --r-md:1.25rem; --r-sm:.9rem;
  --shadow:0 1px 0 rgba(255,255,255,.95) inset,0 10px 30px rgba(23,48,13,.06);
  --blur:blur(24px) saturate(180%);
  --danger:#b91c1c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:6rem}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:6.5rem}
@media(min-width:1120px){body{padding-bottom:2rem}}
svg{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{color:var(--ink);line-height:1.15;margin:0 0 .6rem;font-weight:700;letter-spacing:-.02em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] h4{letter-spacing:0}
p{margin:0 0 1rem}
.container{width:100%;max-width:1200px;margin-inline:auto;padding-inline:1rem}
@media(min-width:640px){.container{padding-inline:1.5rem}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.icon{width:1.25rem;height:1.25rem;min-width:1.25rem;max-width:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}

/* floating glass top bar */
.nav{position:sticky;top:.6rem;z-index:50;padding-inline:.6rem;margin-top:.6rem}
.nav .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:1200px;margin-inline:auto;min-height:4.1rem;padding:.4rem .6rem;padding-inline-start:.9rem;border-radius:999px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-weight:700;color:var(--ink);font-size:1rem;line-height:1.2;letter-spacing:-.01em}
.logo{width:3.2rem;height:3.2rem;flex:none;background:var(--logo) center/contain no-repeat}
.brand small{display:block;font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:0}
.menu{display:none;list-style:none;margin:0;padding:0;gap:.15rem}
.menu a{display:block;font-size:.9rem;font-weight:600;color:#4a5545;text-decoration:none;padding:.5rem .8rem;border-radius:999px;transition:background .15s,color .15s}
.menu a:hover{background:rgba(23,48,13,.06);color:var(--ink)}
.menu a.active{background:var(--fill);color:var(--ink)}
.tools{display:flex;align-items:center;gap:.4rem}
@media(min-width:1120px){.menu{display:flex}}

.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;font-weight:600;font-size:.95rem;line-height:1;padding:.9rem 1.5rem;border-radius:999px;border:0;text-decoration:none;cursor:pointer;transition:background .15s,transform .12s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--accent);color:var(--ink);box-shadow:0 6px 16px rgba(154,205,50,.45)}
.btn-main:hover{background:#8cbf22}
.btn-line{background:var(--fill);color:var(--ink)}
.btn-line:hover{background:rgba(110,125,100,.2)}
.btn-sm{padding:.65rem 1rem;font-size:.85rem}
.round{width:2.75rem;height:2.75rem;padding:0}
.round .icon{width:1.4rem;height:1.4rem;min-width:1.4rem}

/* floating bottom tab bar (phones and tablets) */
.tabbar{position:fixed;inset-inline:.75rem;bottom:calc(.75rem + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:space-around;gap:.15rem;padding:.4rem;border-radius:999px;border:1px solid var(--line);box-shadow:0 12px 32px rgba(23,48,13,.14),0 1px 0 rgba(255,255,255,.95) inset;max-width:30rem;margin-inline:auto;background:#fff}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.66rem;font-weight:600;padding:.45rem .2rem;border-radius:999px;color:#6b7565;text-decoration:none}
.tabbar a.active,.tabbar a.active .icon{color:#111}
.tabbar a.active .icon{stroke-width:2.5}
@media(min-width:1120px){.tabbar{display:none}}
@media(max-width:1119px){
  .nav,.tabbar{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  html.bars-hidden .nav{transform:translateY(calc(-100% - 1rem))}
  html.bars-hidden .tabbar{transform:translateY(calc(100% + 1.5rem))}
}
@media(max-width:639px){.signout .t{display:none}}

/* content */
main{padding-top:1.5rem}
.title{font-size:clamp(1.7rem,4vw,2.5rem)}
.lead{font-size:1.05rem;color:var(--muted)}
.head{margin-bottom:1.5rem}
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1.4rem}
.card h3{font-size:1.1rem}
.card > :last-child{margin-bottom:0}
.grid{display:grid;gap:1rem}
@media(min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.g3{grid-template-columns:repeat(3,1fr)}}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.badge.warn{background:#fdecec;color:var(--danger)}
.badge.grey{background:var(--fill);color:var(--muted)}
.note{font-size:.82rem;color:var(--muted)}
.stat{padding:1rem 1.1rem;border-radius:var(--r-md)}
.stat .num{font-size:2rem;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:.2rem}
.stat .num span{color:var(--accent-ink);font-size:1.1rem}
.stat .lab{font-weight:700;color:var(--ink);margin-top:.5rem;font-size:.9rem}
.stat .icon{color:var(--brand);float:inline-end}

/* lists */
.list{display:grid;gap:.6rem;grid-template-columns:minmax(0,1fr)}
.item{min-width:0}
.item{display:flex;align-items:center;gap:.9rem;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;text-decoration:none;color:inherit;width:100%;font:inherit;text-align:start;cursor:pointer}
a.item:hover,button.item:hover{border-color:rgba(154,205,50,.8)}
.avatar{width:2.9rem;height:2.9rem;border-radius:50%;background:var(--fill);color:var(--ink);font-weight:800;display:grid;place-items:center;flex:none}
.item .grow{flex:1;min-width:0}
.item b{display:block;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span.sub{display:block;font-size:.85rem;color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:none}
[dir=rtl] .right{align-items:flex-start}
.amt{font-weight:700;color:var(--ink)}

/* controls */
.search{position:relative;margin-bottom:1rem}
.search .icon{position:absolute;inset-inline-start:1rem;top:50%;transform:translateY(-50%);color:var(--muted)}
input,select{width:100%;font:inherit;color:var(--ink);background:rgba(110,125,100,.08);border:1px solid transparent;border-radius:var(--r-sm);padding:.8rem 1rem}
.search input{padding-inline-start:2.8rem;border-radius:999px}
input:focus,select:focus{outline:3px solid rgba(154,205,50,.55);background:#fff;border-color:var(--accent-ink)}
label{font-weight:600;font-size:.9rem;color:var(--ink);display:block;margin-bottom:.35rem}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.fbtn{font:inherit;font-weight:600;font-size:.9rem;padding:.55rem 1.1rem;border:0;border-radius:999px;background:var(--fill);color:var(--ink);cursor:pointer}
.fbtn[aria-pressed=true]{background:var(--accent);color:var(--ink)}
.switch{width:3rem;height:1.8rem;border-radius:999px;border:0;background:rgba(110,125,100,.3);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:.2rem;inset-inline-start:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{inset-inline-start:1.4rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{color:var(--ink)}
dl.facts{margin:0;display:grid;gap:.1rem}
dl.facts div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding:.6rem 0}
dl.facts div:last-child{border-bottom:0}
dl.facts dt{color:var(--muted);font-size:.9rem}
dl.facts dd{margin:0;font-weight:600;color:var(--ink);text-align:end}
.bar{height:.6rem;border-radius:999px;background:var(--fill);overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.phead{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.phead .avatar{width:4rem;height:4rem;font-size:1.5rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.fab{position:fixed;inset-inline-end:1rem;bottom:calc(6.2rem + env(safe-area-inset-bottom));z-index:55}
@media(min-width:1120px){.fab{bottom:2rem}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(55% 45% at 85% 5%,rgba(154,205,50,.22),transparent 65%),linear-gradient(180deg,#f6fbe9,#fff)}
.login .card{width:100%;max-width:26rem;text-align:center;background:#fff}
.login .logo{width:6rem;height:6rem;margin:0 auto 1rem}
.login form{display:grid;gap:1rem;text-align:start;margin-top:1.25rem}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em}

/* modal sheet and toast */
.backdrop{position:fixed;inset:0;background:rgba(23,48,13,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:32rem;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(23,48,13,.2);max-height:90vh;overflow:auto}

.sheet form{display:grid;gap:1rem}
.toast{position:fixed;inset-inline:1rem;bottom:calc(6.2rem + env(safe-area-inset-bottom));margin-inline:auto;max-width:24rem;background:var(--ink);color:#fff;padding:.8rem 1.1rem;border-radius:999px;text-align:center;font-weight:600;font-size:.9rem;z-index:90;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
@media(min-width:1120px){.toast{bottom:2rem}}
.lite *{transition:none!important}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

      '<div class="card stat">' + ic("wallet") + '<div class="num">' + (children.length - paidCount(m)) + '</div><div class="lab">' + t("s_pending") + '</div></div></div>' +
      '<div class="grid g2" style="margin-top:1rem;align-items:start">' +
      '<div class="card"><h3>' + t("attn") + '</h3>' + (attn.length ? '<div class="list">' + attn.slice(0, 6).map(function (a) {
        return '<a class="item" href="#/person/' + a.c.id + '"><span class="avatar">' + esc(name(a.c).charAt(0)) + '</span><span class="grow"><b>' + esc(name(a.c)) + '</b><span class="sub">' + esc(a.msg) + '</span></span><span class="badge warn">!</span></a>';
      }).join("") + '</div>' : '<p class="note">' + t("attn_none") + '</p>') + '</div>' +
      '<div class="card"><h3>' + t("quick") + '</h3><div class="actions">' +
      '<button class="btn btn-main" data-act="add">' + ic("plus") + t("add_child") + '</button>' +
      '<button class="btn btn-line" data-act="csv-people">' + ic("download") + t("export_csv") + '</button>' +
      '<a class="btn btn-line" href="#/reports">' + ic("file") + t("month_rep") + '</a></div>' +
      '<p class="note" style="margin-top:1rem">' + t("set_data") + '</p></div></div>';
  }

  function peopleItems() {
    var q = state.q.trim().toLowerCase();
    var rows = children.filter(function (c) {
      if (state.tab !== "all" && c.pay !== state.tab) return false;
      return !q || (c.en + " " + c.ar + " " + c.ref + " " + c.guardian).toLowerCase().indexOf(q) > -1;
    });
    if (!rows.length) return '<p class="note">' + t("none") + '</p>';
    return rows.map(function (c) {
      var badge = c.bank ? (c.bank.verified ? '<span class="badge">' + t("verified") + '</span>' : '<span class="badge warn">' + t("notver") + '</span>') : '<span class="badge grey">' + t("cash") + '</span>';
      return '<a class="item" href="#/person/' + c.id + '"><span class="avatar">' + esc(name(c).charAt(0)) + '</span><span class="grow"><b>' + esc(name(c)) + '</b><span class="sub">' + c.ref + ' · ' + esc(c.guardian) + '</span></span><span class="right">' + badge + '<span class="amt">' + money(c.amount) + '</span></span></a>';
    }).join("");
  }
  function vPeople() {
    var n = { all: children.length, bank: children.filter(function (c) { return c.pay === "bank"; }).length, cash: children.filter(function (c) { return c.pay === "cash"; }).length };
    return '<div class="head"><h1 class="title">' + t("people") + '</h1></div>' +
      '<div class="search">' + ic("search") + '<input id="q" type="search" placeholder="' + esc(t("search")) + '" value="' + esc(state.q) + '" aria-label="' + esc(t("search")) + '"></div>' +
      '<div class="filters" role="group">' + ["all", "bank", "cash"].map(function (k) {
        return '<button class="fbtn" type="button" data-act="tab" data-v="' + k + '" aria-pressed="' + (state.tab === k) + '">' + t(k) + " (" + n[k] + ")</button>";
      }).join("") + '</div><div class="list" id="plist">' + peopleItems() + '</div>' +
      '<button class="btn btn-main fab" data-act="add">' + ic("plus") + t("add_child") + '</button>';
  }

  function facts(rows) {
    return '<dl class="facts">' + rows.map(function (r) { return "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>"; }).join("") + "</dl>";
  }
  function vPerson(id) {
    var c = children.filter(function (x) { return x.id === id; })[0];
    if (!c) return '<a class="btn btn-line btn-sm" href="#/people">' + ic("back", "flip") + t("back") + '</a><p class="note" style="margin-top:1rem">' + t("none") + "</p>";
    var docs = ["d_birth", "d_death", "d_school", "d_id"].map(function (k) {
      return '<button class="item" type="button" data-act="docnote"><span class="grow"><b>' + t(k) + '</b></span><span class="badge ' + (c.docs[k] ? "" : "warn") + '">' + (c.docs[k] ? t("doc_on") : t("doc_missing")) + "</span></button>";
    }).join("");
    var bankCard = c.bank ?
      '<div class="card"><h3>' + t("sec_bank") + '</h3>' + facts([[t("f_holder"), esc(c.bank.holder)], [t("f_bankname"), esc(c.bank.name)], [t("f_last4"), "<span dir=ltr>•••• " + c.bank.last4 + "</span>"]]) +
      '<div class="setrow"><b>' + t("verify") + '</b><button class="switch" type="button" role="switch" aria-checked="' + c.bank.verified + '" aria-label="' + t("verify") + '" data-act="verify" data-id="' + c.id + '"></button></div></div>' :
      '<div class="card"><h3>' + t("sec_bank") + '</h3><p class="note">' + t("cash_only") + "</p></div>";
    return '<a class="btn btn-line btn-sm" href="#/people">' + ic("back", "flip") + t("back") + "</a>" +
      '<div class="card" style="margin:1rem 0"><div class="phead"><span class="avatar">' + esc(name(c).charAt(0)) + '</span><div style="flex:1"><h1 class="title" style="font-size:1.7rem;margin:0">' + esc(name(c)) + '</h1><span class="note">' + c.ref + '</span></div><span class="badge">' + t("active") + "</span></div></div>" +
      '<div class="grid g2" style="align-items:start">' +
      '<div class="card"><h3>' + t("sec_personal") + "</h3>" + facts([[t("f_gender"), t(c.gender === "m" ? "male" : "female")], [t("f_dob"), c.dob], [t("f_city"), esc(c.city)], [t("f_health"), t(c.health)], [t("f_grade"), c.grade]]) + "</div>" +
      '<div class="card"><h3>' + t("sec_mother") + "</h3>" + facts([[t("f_mother"), esc(c.mother)], [t("f_mstatus"), t("widowed")], [t("f_fdeath"), c.fdeath], [t("f_bro"), c.bro], [t("f_sis"), c.sis]]) + "</div>" +
      '<div class="card"><h3>' + t("sec_resp") + "</h3>" + facts([[t("f_guardian"), esc(c.guardian)], [t("f_rel"), c.rel], [t("f_phone"), "<span dir=ltr>" + c.phone + "</span>"]]) + "</div>" +
      '<div class="card"><h3>' + t("sec_docs") + '</h3><div class="list">' + docs + "</div></div>" + bankCard +
      '<div class="card"><h3>' + t("sec_channel") + "</h3>" + facts([[t("f_channel"), chName(c.channel)], [t("f_source"), t(c.pay === "bank" ? "bank_pay" : "cash_only")], [t("f_since"), c.since], [t("f_amount"), money(c.amount) + " " + t("per_month")]]) +
      '<h3 style="margin-top:1rem;font-size:1rem">' + t("sec_hist") + "</h3>" + facts(c.hist.map(function (h) { return [h[0], chName(h[1])]; })) + "</div></div>";
  }

  function monthPills() {
    return '<div class="filters" role="group">' + MONTHS.map(function (m) {
      return '<button class="fbtn" type="button" data-act="month" data-v="' + m.k + '" aria-pressed="' + (state.month === m.k) + '">' + (lang === "ar" ? m.ar : m.en) + "</button>";
    }).join("") + "</div>";
  }
  function vPay() {
    var m = state.month;
    return '<div class="head"><h1 class="title">' + t("pay_title") + "</h1></div>" + monthPills() +
      '<div class="grid g2"><div class="card stat"><div class="num">' + money(sum(m, "paid")) + '</div><div class="lab">' + t("total_paid") + '</div></div><div class="card stat"><div class="num">' + money(sum(m, "pending")) + '</div><div class="lab">' + t("total_due") + "</div></div></div>" +
      '<div class="list" style="margin-top:1rem">' + children.map(function (c) {
        var st = pay[m][c.id], right = st === "paid" ? '<span class="badge">' + t("paid") + "</span>" : '<span class="badge warn">' + t("pending") + "</span>";
        var act = st === "pending" && c.pay === "cash" ? '<button class="btn btn-line btn-sm" data-act="cash" data-id="' + c.id + '">' + t("mark_cash") + "</button>" : "";
        return '<div class="item"><a class="avatar" href="#/person/' + c.id + '" style="text-decoration:none">' + esc(name(c).charAt(0)) + '</a><span class="grow"><b>' + esc(name(c)) + '</b><span class="sub">' + c.ref + " · " + t(c.pay) + '</span></span><span class="right">' + right + '<span class="amt">' + money(c.amount) + "</span>" + act + "</span></div>";
      }).join("") + "</div>";
  }

  function vProj() {
    return '<div class="head"><h1 class="title">' + t("proj_title") + '</h1></div><div class="grid g2">' + projects.map(function (p) {
      var pct = Math.round(p.spent / p.budget * 100);
      return '<div class="card"><span class="badge ' + (p.done ? "grey" : "") + '">' + t(p.done ? "st_done" : "st_active") + '</span><h3 style="margin-top:.7rem">' + esc(lang === "ar" ? p.ar : p.en) + '</h3><p class="note" style="margin-top:0">' + esc(p.loc) + "</p>" +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' + facts([[t("budget"), money(p.budget)], [t("spent"), money(p.spent)], [t("progress"), pct + "%"]]) + "</div>";
    }).join("") + "</div>";
  }

  function scoped() { return children.filter(function (c) { return state.scope === "all" || c.pay === state.scope; }); }
  function vRep() {
    var m = state.month, rows = scoped(), paid = rows.filter(function (c) { return pay[m][c.id] === "paid"; });
    var total = rows.reduce(function (a, c) { return a + c.amount; }, 0), got = paid.reduce(function (a, c) { return a + c.amount; }, 0);
    return '<div class="head"><h1 class="title">' + t("rep_title") + "</h1></div>" +
      '<p class="note" style="margin:0 0 .4rem">' + t("rep_scope") + "</p>" +
      '<div class="filters" role="group">' + ["all", "bank", "cash"].map(function (k) { return '<button class="fbtn" type="button" data-act="scope" data-v="' + k + '" aria-pressed="' + (state.scope === k) + '">' + t(k) + "</button>"; }).join("") + "</div>" +
      '<p class="note" style="margin:0 0 .4rem">' + t("rep_month") + "</p>" + monthPills() +
      '<div class="card"><h3>' + t("rep_sum") + " · " + monthLabel(m) + "</h3>" + facts([[t("s_children"), rows.length], [t("paid"), paid.length + " / " + rows.length], [t("total_paid"), money(got)], [t("total_due"), money(total - got)]]) +
      '<div class="actions" style="margin-top:1rem"><button class="btn btn-main" data-act="pdf">' + ic("file") + t("rep_pdf") + '</button><button class="btn btn-line" data-act="csv-pay">' + ic("download") + t("export_csv") + "</button></div></div>";
  }

  function vSet() {
    function sw(k, label) { return '<div class="setrow"><b>' + label + '</b><button class="switch" type="button" role="switch" aria-checked="' + state[k] + '" aria-label="' + esc(label) + '" data-act="toggle" data-k="' + k + '"></button></div>'; }
    return '<div class="head"><h1 class="title">' + t("set_title") + '</h1></div><div class="card" style="max-width:36rem">' + sw("reminders", t("set_rem")) + sw("amounts", t("set_amt")) +
      '<div class="setrow"><b>' + t("set_lang") + '</b><button class="btn btn-line btn-sm" data-act="lang">' + t("lang_btn") + "</button></div>" +
      '<div class="setrow"><b>' + t("set_role") + '</b><span class="badge">' + t("role_admin") + "</span></div>" +
      '<div class="setrow"><button class="btn btn-line btn-sm" data-act="signout">' + ic("logout") + t("signout") + "</button></div>" +
      '<p class="note">' + t("set_data") + "</p></div>";
  }

  /* ---------------- shell ---------------- */
  var TABS = [["home", "home", "n_home"], ["people", "users", "n_people"], ["pay", "wallet", "n_pay"], ["proj", "folder", "n_proj"], ["settings", "sliders", "n_set"]];
  var MENU = [["home", "n_home"], ["people", "n_people"], ["pay", "n_pay"], ["proj", "n_proj"], ["reports", "n_rep"], ["settings", "n_set"]];
  var ROUTES = { home: vHome, people: vPeople, person: function (r) { return vPerson(r.id); }, pay: vPay, proj: vProj, reports: vRep, settings: vSet };
  function baseTab(n) { return n === "person" ? "people" : n; }

  function render() {
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("brand") + " | " + t("staff");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (n) { n.textContent = t(n.getAttribute("data-t")); });
    $("#login").classList.toggle("hidden", state.authed);
    $("#app").classList.toggle("hidden", !state.authed);
    if (!state.authed) return;
    var r = route(), cur = baseTab(r.name);
    $("#menu").innerHTML = MENU.map(function (m) { return '<li><a href="#/' + m[0] + '"' + (cur === m[0] ? ' class="active" aria-current="page"' : "") + ">" + t(m[1]) + "</a></li>"; }).join("");
    $("#tabbar").innerHTML = TABS.map(function (m) { return '<a href="#/' + m[0] + '"' + (cur === m[0] ? ' class="active" aria-current="page"' : "") + ">" + ic(m[1]) + "<span>" + t(m[2]) + "</span></a>"; }).join("");
    $("#view").innerHTML = (ROUTES[r.name] || vHome)(r);
    var q = $("#q"); if (q) q.addEventListener("input", function () { state.q = q.value; $("#plist").innerHTML = peopleItems(); });
  }

  /* ---------------- actions ---------------- */
  function csv(rows) { return rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n"); }
  function download(fileName, text) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }));
    a.download = fileName; document.body.appendChild(a); a.click(); a.remove(); toast(t("exported"));
  }
  function openAdd() {
    $("#sheetRoot").innerHTML = '<div class="backdrop" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(t("add_title")) + '"><h3>' + t("add_title") + '</h3>' +
      '<form id="addForm" novalidate><div><label for="aEn">' + t("f_name_en") + '</label><input id="aEn" dir="ltr"><div class="err" id="aErr"></div></div>' +
      '<div><label for="aAr">' + t("f_name_ar") + '</label><input id="aAr" dir="rtl"></div>' +
      '<div><label for="aG">' + t("f_guardian") + '</label><input id="aG"></div>' +
      '<div><label for="aP">' + t("f_paytype") + '</label><select id="aP"><option value="bank">' + t("bank_pay") + '</option><option value="cash">' + t("cash_only") + '</option></select></div>' +
      '<div class="actions"><button class="btn btn-main" type="submit">' + t("save") + '</button><button class="btn btn-line" type="button" data-act="close">' + t("cancel") + "</button></div></form></div></div>";
    $("#aEn").focus();
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "close") { if (e.target === el || el.tagName === "BUTTON") $("#sheetRoot").innerHTML = ""; return; }
    var id = parseInt(el.getAttribute("data-id"), 10), v = el.getAttribute("data-v");
    if (a === "lang") { lang = lang === "en" ? "ar" : "en"; try { localStorage.setItem("acf_lang", lang); } catch (x) {} render(); }
    else if (a === "signout") { state.authed = false; try { sessionStorage.removeItem("acf_auth"); } catch (x) {} location.hash = ""; render(); }
    else if (a === "tab") { state.tab = v; render(); }
    else if (a === "month") { state.month = v; render(); }
    else if (a === "scope") { state.scope = v; render(); }
    else if (a === "toggle") { state[el.getAttribute("data-k")] = !state[el.getAttribute("data-k")]; render(); }
    else if (a === "verify") { var c = children.filter(function (x) { return x.id === id; })[0]; c.bank.verified = !c.bank.verified; render(); toast(t(c.bank.verified ? "ver_on" : "ver_off")); }
    else if (a === "cash") { pay[state.month][id] = "paid"; render(); toast(t("cash_marked")); }
    else if (a === "add") openAdd();
    else if (a === "docnote") toast(t("doc_upload"));
    else if (a === "pdf") toast(t("pdf_next"));
    else if (a === "csv-people") download("children.csv", csv([["ref", "name_en", "name_ar", "guardian", "payment", "monthly_amount_" + CUR]].concat(children.map(function (c) { return [c.ref, c.en, c.ar, c.guardian, c.pay, c.amount]; }))));
    else if (a === "csv-pay") download("payments-" + state.month + ".csv", csv([["ref", "name_en", "payment", "status", "amount_" + CUR]].concat(scoped().map(function (c) { return [c.ref, c.en, c.pay, pay[state.month][c.id], c.amount]; }))));
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "loginForm") {
      e.preventDefault();
      var em = $("#lEmail").value.trim(), pw = $("#lPass").value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) || !pw) { $("#loginErr").textContent = t("login_err"); return; }
      $("#loginErr").textContent = ""; state.authed = true; try { sessionStorage.setItem("acf_auth", "1"); } catch (x) {}
      if (!location.hash) location.hash = "#/home"; render();
    } else if (e.target.id === "addForm") {
      e.preventDefault();
      var en = $("#aEn").value.trim();
      if (!en) { $("#aErr").textContent = t("required"); return; }
      var n = children.length + 1;
      var c = { id: n, ref: "ACF-" + ("000" + n).slice(-4), en: en, ar: $("#aAr").value.trim() || en, gender: "m", dob: "2015-01-01", city: CITIES[0], health: "good", grade: "Grade 1",
        guardian: $("#aG").value.trim() || "-", rel: "-", phone: "-", mother: "-", bro: 0, sis: 0, fdeath: "-", pay: $("#aP").value, amount: 150,
        bank: $("#aP").value === "bank" ? { holder: $("#aG").value.trim() || en, name: BANKS[0], last4: "0000", verified: false } : null,
        channel: "direct", since: "2026-11-20", docs: { d_birth: false, d_death: false, d_school: false, d_id: false }, hist: [["2026-11-20", "direct"]] };
      children.push(c); MONTHS.forEach(function (m) { pay[m.k][n] = "pending"; });
      $("#sheetRoot").innerHTML = ""; render(); toast(t("saved"));
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("#sheetRoot").innerHTML = ""; });
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  // phones and tablets: hide the bars while scrolling down, show them when scrolling up
  var lastY = window.scrollY, ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      var y = window.scrollY, d = y - lastY;
      if (y < 80 || d < -6) root.classList.remove("bars-hidden"); else if (d > 6) root.classList.add("bars-hidden");
      if (Math.abs(d) > 6 || y < 80) lastY = y; ticking = false;
    });
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
